name: blind_assistant
description: Voice-first object detection and navigation assistant for blind and low-vision users.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Camera (works on Android, iOS, and Web)
  camera: ^0.11.0+2

  # Networking
  web_socket_channel: ^3.0.1
  http: ^1.2.2

  # mDNS / DNS-SD: automatic backend discovery (resolves _blindassist._tcp.local.)
  # On Android requires ACCESS_WIFI_STATE + CHANGE_NETWORK_STATE permissions.
  nsd: ^5.0.1

  # QR code generation: fallback when mDNS is blocked (guest Wi-Fi / VPN)
  qr_flutter: ^4.1.0

  # Voice
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0

  # Permissions (mobile only — no-op on web)
  permission_handler: ^11.3.1

  # Local persistence (settings)
  shared_preferences: ^2.3.2

  cupertino_icons: ^1.0.8
  tflite_flutter: ^0.12.1
  image: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/test/

